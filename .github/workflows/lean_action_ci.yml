name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: No sorry or admit
        run: |
          if grep -R -nE '\b(sorry|admit)\b' LeanGeodesy LeanGeodesy.lean; then
            exit 1
          fi
      - name: Proofs do not depend on EPSG labels
        run: |
          if grep -rlE 'CRS\.EPSG|epsg[0-9]+' LeanGeodesy LeanGeodesy.lean | grep -vxE 'LeanGeodesy/CRS/EPSG\.lean|LeanGeodesy\.lean'; then
            exit 1
          fi

  # LeanGeodesy and LeanGeospatial must stay importable together, on one
  # plane. The sibling is taken from the branch of the same name when it
  # exists, so a coordinated change can be tested on both before merging.
  joint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          path: LeanGeodesy
      - name: Check out LeanGeospatial
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/yuiseki/LeanGeospatial "$branch" > /dev/null; then
            ref="$branch"
          else
            ref=main
          fi
          echo "Using LeanGeospatial $ref"
          git clone --depth 1 --branch "$ref" https://github.com/yuiseki/LeanGeospatial LeanGeospatial
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: LeanGeodesy and LeanGeospatial share one plane
        run: LeanGeodesy/scripts/joint_check.sh LeanGeodesy LeanGeospatial joint
