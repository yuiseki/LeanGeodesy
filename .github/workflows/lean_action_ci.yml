name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: No sorry or admit
        run: |
          if grep -R -nE '\b(sorry|admit)\b' LeanGeodesy LeanGeodesy.lean; then
            exit 1
          fi
      - name: Proofs do not depend on EPSG labels
        run: |
          if grep -rlE 'CRS\.EPSG|epsg[0-9]+' LeanGeodesy LeanGeodesy.lean | grep -vxE 'LeanGeodesy/CRS/EPSG\.lean|LeanGeodesy\.lean'; then
            exit 1
          fi
