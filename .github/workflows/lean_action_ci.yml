name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: No sorry or admit
        run: |
          if grep -R -nE '\b(sorry|admit)\b' LeanGeodesy LeanGeodesy.lean LeanGeodesyResearch LeanGeodesyResearch.lean; then
            exit 1
          fi
      - name: Proofs do not depend on EPSG labels
        run: |
          if grep -rlE 'CRS\.EPSG|epsg[0-9]+' LeanGeodesy LeanGeodesy.lean LeanGeodesyResearch LeanGeodesyResearch.lean | grep -vxE 'LeanGeodesy/CRS/EPSG\.lean|LeanGeodesy\.lean'; then
            exit 1
          fi

  # LeanGeodesy, LeanGeospatial and LeanComputationalGeometry must stay
  # importable together, on one plane. Each sibling is taken from the branch of
  # the same name when it exists, so a coordinated change can be tested across
  # all three before merging.
  joint:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2

    steps:
      - uses: actions/checkout@v5
        with:
          path: LeanGeodesy
      - name: Check out the sibling libraries
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for sib in LeanGeospatial LeanComputationalGeometry; do
            if git ls-remote --exit-code --heads "https://github.com/yuiseki/$sib" "$branch" > /dev/null; then
              ref="$branch"
            else
              ref=main
            fi
            echo "Using $sib $ref"
            git clone --depth 1 --branch "$ref" "https://github.com/yuiseki/$sib" "$sib"
          done
      - uses: actions/cache@v5
        with:
          path: |
            joint/.lake
            joint/lake-manifest.json
            LeanGeodesy/.lake
            LeanGeospatial/.lake
            LeanComputationalGeometry/.lake
          key: joint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('LeanGeodesy/lean-toolchain', 'LeanGeodesy/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            joint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('LeanGeodesy/lean-toolchain', 'LeanGeodesy/lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The three libraries share one plane
        run: LeanGeodesy/scripts/joint_check.sh LeanGeodesy LeanGeospatial LeanComputationalGeometry joint
