name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # One cache for the library and every nested project, saved at the end
      # of the job so that it holds the Verso and VersoBlueprint
      # builds too. lean-action's own cache is saved right after the library
      # builds, before any of those, and is keyed on the commit, so it would
      # store a new copy of the library on every push without them.
      # The key changes only when a toolchain or a manifest does; the
      # projects' own modules are rebuilt from the cached state as needed.
      - uses: actions/cache@v5
        with:
          path: |
            .lake
            manual/.lake
            blueprint/.lake
            blueprint-yaruo/.lake
          key: pages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '*/lean-toolchain', '*/lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
      - name: Build the Verso book
        working-directory: manual
        run: |
          lake build
          lake env lean --run LeanGeodesyManualMain.lean --output _out
          lake env lean --run LeanGeodesyManualJaMain.lean --output _out-ja
          lake env lean --run LeanGeodesyBookYaruoMain.lean --output _out-yaruo
      - name: Build the Verso Blueprint
        working-directory: blueprint
        run: lake exe vbp build
      - name: Build the dialogue Blueprint
        working-directory: blueprint-yaruo
        run: lake exe vbp build
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r manual/_out/html-multi site/manual
          cp -r manual/_out-ja/html-multi site/manual-ja
          cp -r manual/_out-yaruo/html-multi site/book-yaruo
          cp -r blueprint/_out/site/html-multi site/blueprint
          cp -r blueprint-yaruo/_out/site/html-multi site/blueprint-yaruo
          cp pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
