name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build the Verso book
        working-directory: manual
        run: |
          lake build
          lake env lean --run LeanGeodesyManualMain.lean --output _out
          lake env lean --run LeanGeodesyManualJaMain.lean --output _out-ja
          lake env lean --run LeanGeodesyBookYaruoMain.lean --output _out-yaruo
      - name: Generate the Lean Atlas graph
        working-directory: atlas
        run: |
          lake build LeanGeodesyAtlas atlas-graph
          lake exe atlas-graph graph.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Lean Atlas viewer
        run: atlas/build-pages.sh site/atlas "/${{ github.event.repository.name }}/atlas"
      - name: Assemble the site
        run: |
          cp -r manual/_out/html-multi site/manual
          cp -r manual/_out-ja/html-multi site/manual-ja
          cp -r manual/_out-yaruo/html-multi site/book-yaruo
          cp pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
