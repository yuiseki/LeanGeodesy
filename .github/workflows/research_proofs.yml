name: Research Proofs CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly full zero-cache verification (Sunday 03:00 UTC)
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Force full zero-cache verification of LeanGeodesyResearch"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      use_cache: ${{ steps.check.outputs.use_cache }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        name: Check exact transitive dependencies of LeanGeodesyResearch
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.ref_type }}" == "tag" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "use_cache=false" >> "$GITHUB_OUTPUT"
            echo "Unconditional zero-cache run (${{ github.event_name }})."
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.no_cache }}" == "true" ]]; then
              echo "use_cache=false" >> "$GITHUB_OUTPUT"
            else
              echo "use_cache=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "use_cache=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(python3 scripts/check_research_deps.py "$BASE" "$HEAD")
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "use_cache=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        if: needs.detect.outputs.use_cache == 'true'
        with:
          path: .lake
          key: research-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            research-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build and kernel-verify LeanGeodesyResearch (including axiom audit)
        run: lake build LeanGeodesyResearch
      - name: No sorry or admit
        run: |
          if grep -R -nE '\b(sorry|admit)\b' LeanGeodesy LeanGeodesy.lean LeanGeodesyResearch LeanGeodesyResearch.lean; then
            exit 1
          fi
      - name: Proofs do not depend on EPSG labels
        run: |
          if grep -rlE 'CRS\.EPSG|epsg[0-9]+' LeanGeodesy LeanGeodesy.lean LeanGeodesyResearch LeanGeodesyResearch.lean | grep -vxE 'LeanGeodesy/CRS/EPSG\.lean|LeanGeodesy\.lean'; then
            exit 1
          fi
