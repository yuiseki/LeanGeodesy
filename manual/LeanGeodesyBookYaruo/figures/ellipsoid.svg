<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="440" height="420" role="img">
<title>赤道半径 a と極半径 b の回転楕円体の断面</title>

<style>
  .body { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
  .aux { fill: none; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .ink { fill: none; stroke: #1f2937; stroke-width: 1.6; }
  .blue { fill: none; stroke: #1d4ed8; stroke-width: 2.4; }
  .orange { fill: none; stroke: #c2410c; stroke-width: 2.4; stroke-dasharray: 8 5; }
  .dot { fill: #1f2937; }
  .math { font-family: "Times New Roman", "STIX Two Text", "Cambria Math", serif; font-style: italic; font-size: 20px; fill: #1f2937; }
  .math.blue-t { fill: #1d4ed8; }
  .math.orange-t { fill: #c2410c; }
  .up { font-style: normal; }
  .ja { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", sans-serif; font-size: 15px; font-style: normal; fill: #1f2937; }
  .ja.muted { fill: #6b7280; font-size: 13px; }
  .ja.blue-t { fill: #1d4ed8; }
  .ja.orange-t { fill: #c2410c; }
</style>

<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<line x1="210.0" y1="24.0" x2="210.0" y2="310.0" class="aux"/>
<text x="218.0" y="18.0" class="ja muted" text-anchor="start">地軸</text>
<line x1="30.0" y1="170.0" x2="390.0" y2="170.0" class="aux"/>
<ellipse cx="210" cy="170" rx="160" ry="110" class="body"/>
<circle cx="210" cy="170" r="3.5" class="dot"/>
<text x="196.0" y="192.0" class="math" text-anchor="middle">O</text>
<line x1="210.0" y1="170.0" x2="370.0" y2="170.0" class="blue" marker-end="url(#arrow-blue)"/>
<text x="290.0" y="158.0" class="math blue-t" text-anchor="middle">a</text>
<line x1="210.0" y1="170.0" x2="210.0" y2="60.0" class="orange" marker-end="url(#arrow-orange)"/>
<text x="194.0" y="121.0" class="math orange-t" text-anchor="middle">b</text>
<text x="366.0" y="192.0" class="ja muted" text-anchor="end">赤道</text>
<text x="210.0" y="340.0" class="math" text-anchor="middle"><tspan class="math">f</tspan><tspan class="math up"> = (</tspan><tspan class="math blue-t">a</tspan><tspan class="math up"> − </tspan><tspan class="math orange-t">b</tspan><tspan class="math up">) / </tspan><tspan class="math blue-t">a</tspan></text>
<text x="210.0" y="372.0" class="math" text-anchor="middle"><tspan class="ja">WGS 84：</tspan><tspan class="math">a</tspan><tspan class="ja"> = 6378137 m、</tspan><tspan class="math up">1/</tspan><tspan class="math">f</tspan><tspan class="ja"> = 298.257223563</tspan></text>
<text x="210.0" y="400.0" class="ja muted" text-anchor="middle">扁平率は説明のため誇張</text>
</svg>
