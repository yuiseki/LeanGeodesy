  .math { font-family: "Times New Roman", "STIX Two Text", "Cambria Math", serif; font-style: italic; font-size: 20px; fill: #1f2937; }
  .math.blue-t { fill: #1d4ed8; }
  .math.orange-t { fill: #c2410c; }
  .up { font-style: normal; }
  .ja { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", sans-serif; font-size: 15px; font-style: normal; fill: #1f2937; }
  .ja.muted { fill: #6b7280; font-size: 13px; }
  .ja.blue-t { fill: #1d4ed8; }
  .ja.orange-t { fill: #c2410c; }
</style>

<defs>
