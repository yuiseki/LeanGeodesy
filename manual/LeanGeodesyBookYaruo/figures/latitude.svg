<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img">
<title>楕円体の点 P における測地緯度 φ と地心緯度 ψ</title>

<style>
  .body { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
