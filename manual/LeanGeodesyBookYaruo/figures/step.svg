<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img">
<title>点 P から北と東への直交する二つの一歩と、斜めの一歩 ds</title>

<style>
  .body { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
  .aux { fill: none; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .ink { fill: none; stroke: #1f2937; stroke-width: 1.6; }
  .blue { fill: none; stroke: #1d4ed8; stroke-width: 2.4; }
  .orange { fill: none; stroke: #c2410c; stroke-width: 2.4; stroke-dasharray: 8 5; }
  .dot { fill: #1f2937; }
  .math { font-family: "Times New Roman", "STIX Two Text", "Cambria Math", serif; font-style: italic; font-size: 20px; fill: #1f2937; }
  .math.blue-t { fill: #1d4ed8; }
  .math.orange-t { fill: #c2410c; }
  .up { font-style: normal; }
  .ja { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", sans-serif; font-size: 15px; font-style: normal; fill: #1f2937; }
  .ja.muted { fill: #6b7280; font-size: 13px; }
  .ja.blue-t { fill: #1d4ed8; }
  .ja.orange-t { fill: #c2410c; }
</style>

<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<path d="M55,315 Q45,165.0 55,60" class="aux"/>
<path d="M435,315 Q425,165.0 435,60" class="aux"/>
<path d="M40,312 Q275.0,324 450,312" class="aux"/>
<path d="M40,66 Q275.0,78 450,66" class="aux"/>
<line x1="170.0" y1="240.0" x2="170.0" y2="90.0" class="blue" marker-end="url(#arrow-blue)"/>
<line x1="170.0" y1="240.0" x2="380.0" y2="240.0" class="blue" marker-end="url(#arrow-blue)"/>
<line x1="170.0" y1="240.0" x2="380.0" y2="90.0" class="orange" marker-end="url(#arrow-orange)"/>
<line x1="380.0" y1="240.0" x2="380.0" y2="90.0" class="aux"/>
<line x1="170.0" y1="90.0" x2="380.0" y2="90.0" class="aux"/>
<path d="M170.0,226.0 L184.0,226.0 L184.0,240.0" class="ink" stroke-width="1.2"/>
<circle cx="170" cy="240" r="4" class="dot"/>
<text x="160.0" y="262.0" class="math" text-anchor="end">P</text>
<text x="156.0" y="159.0" class="math blue-t" text-anchor="end">∂r/∂φ</text>
<text x="156.0" y="185.0" class="math" text-anchor="end"><tspan class="math blue-t">M dφ</tspan></text>
<text x="275.0" y="270.0" class="math blue-t" text-anchor="middle">∂r/∂λ</text>
<text x="275.0" y="294.0" class="math blue-t" text-anchor="middle">N cos φ dλ</text>
<text x="263.0" y="151.0" class="math orange-t" text-anchor="end">ds</text>
<text x="396.0" y="86.0" class="ja muted" text-anchor="start">北</text>
<text x="396.0" y="246.0" class="ja muted" text-anchor="start">東</text>
<text x="260.0" y="395.0" class="math" text-anchor="middle">ds² = (M dφ)² + (N cos φ dλ)²</text>
</svg>
