name = "LeanGeodesyManual"
reservoir = false
version = "0.1.0"
packagesDir = "../.lake/packages"
defaultTargets = ["LeanGeodesyManual"]

[[require]]
name = "lean-geodesy"
path = "../"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.34.0"

[[lean_lib]]
name = "LeanGeodesyManual"
globs = ["LeanGeodesyManual", "LeanGeodesyManual.+", "LeanGeodesyManualJa", "LeanGeodesyManualJa.+"]

